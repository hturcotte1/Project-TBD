<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Common App — Log In</title></head>
<body>

<main data-testid="login-page">
<h1>Log in to Common App</h1>

<form data-testid="login-form" method="post" action="/account/login">
  <label>Email <input type="email" name="email" /></label>
  <label>Password <input type="password" name="password" /></label>
  <label><input type="checkbox" name="remember_device" value="1" /> Remember this device</label>
  <button type="submit" data-testid="login-submit">Log In</button>
</form>
</main>
</body>
</html>
